# CodeQL for react-native-drum-picker (Android Fabric library + TypeScript API).
# Languages: JavaScript/TypeScript (src/), Kotlin (android/), GitHub Actions workflows.

name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  schedule:
    # Weekly security scan (Saturday 09:19 UTC).
    - cron: '19 9 * * 6'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install dependencies (TypeScript)
        if: matrix.language == 'javascript-typescript'
        uses: ./.github/actions/setup

      - name: Build TypeScript output
        if: matrix.language == 'javascript-typescript'
        run: yarn build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Install dependencies (Kotlin)
        if: matrix.build-mode == 'manual'
        uses: ./.github/actions/setup

      - name: Setup Java
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: '17'

      - name: Build Android library for CodeQL
        if: matrix.build-mode == 'manual'
        run: |
          chmod +x example/android/gradlew
          cd example/android
          ./gradlew :react-native-drum-picker:compileDebugKotlin --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
