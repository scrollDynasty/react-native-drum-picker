name: publish

on:
  push:
    tags:
      - 'v*'
      # release-please component tags (until include-component-in-tag: false)
      - 'react-native-drum-picker-v*'

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test --maxWorkers=2

      - name: Build
        run: yarn build

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#react-native-drum-picker-v}"
          TAG_VERSION="${TAG_VERSION#v}"
          echo "package.json: $PKG_VERSION"
          echo "git tag:      $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch: package.json=$PKG_VERSION tag=$TAG_VERSION"
            exit 1
          fi
          echo "✅ Versions match: $PKG_VERSION"

      # Node only — do not set registry-url/token here; that injects NODE_AUTH_TOKEN
      # and npm uses the token instead of OIDC (causes EOTP with 2FA).
      - name: Setup Node for publish
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Publish to npm
        run: npm publish --access public

      - name: Summary
        run: |
          echo "## 🚀 Published to npm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Package | react-native-drum-picker |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm | https://www.npmjs.com/package/react-native-drum-picker |" >> $GITHUB_STEP_SUMMARY
