name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: lint-and-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  js-tests:
    name: js-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn build

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        continue-on-error: true
        with:
          fail_ci_if_error: false

  android-build:
    name: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write

    env:
      TURBO_CACHE_DIR: .turbo/android

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for Android
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-

      - name: Check turborepo cache for Android
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: env.turbo_cache_hit != 1
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"


      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x example/android/gradlew

      - name: Build example for Android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"

  ios-build:
    name: ios-build
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write

    env:
      XCODE_VERSION: 26
      RCT_NEW_ARCH_ENABLED: 1
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build library and prepare iOS codegen
        run: |
          yarn build
          node example/scripts/prepare-ios-codegen.mjs

      - name: Cache Pods
        id: cocoapods-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile', 'DrumPicker.podspec', 'example/Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: example/ios
        run: |
          bundle install --gemfile=../Gemfile
          bundle exec pod install

      - name: Build iOS example
        working-directory: example/ios
        run: |
          xcodebuild \
            -workspace DrumPickerExample.xcworkspace \
            -scheme DrumPickerExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  android-instrumented:
    name: android-instrumented
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn build

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Make Gradle wrapper executable
        run: chmod +x example/android/gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # android-emulator-runner creates test_avd_34 on first run.
      # force-avd-creation: false reuses it on cached runners.
      # If the job fails with "No AVD found", set to true temporarily.
      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@70f4dee990796918b78d040e3278474bdbd348a7 # v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          avd-name: test_avd_34
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash -c "cd example/android && chmod +x ./gradlew && ./gradlew :react-native-drum-picker:connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.package=com.drumpicker"

      - name: Upload Android test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-instrumented-results
          path: |
            android/build/reports/androidTests/connected/
            android/build/outputs/androidTest-results/connected/

  ios-unit-tests:
    name: ios-unit-tests
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write

    env:
      RCT_NEW_ARCH_ENABLED: 1
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: 26

      - name: Build library and prepare iOS codegen
        run: |
          yarn build
          node example/scripts/prepare-ios-codegen.mjs

      - name: Cache CocoaPods
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cocoapods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('DrumPicker.podspec') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Run DrumPicker XCTest (pod test spec)
        working-directory: example/ios
        run: |
          bundle install --gemfile=../Gemfile
          bundle exec pod lib lint ../../DrumPicker.podspec \
            --platforms=ios \
            --test-specs=Tests \
            --skip-import-validation \
            --allow-warnings \
            2>&1 | tee pod-lint.log
        env:
          NSUnbufferedIO: YES

      - name: Upload pod lint log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pod-lint-log
          path: example/ios/pod-lint.log

  detox-ios:
    name: detox-ios
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write

    env:
      RCT_NEW_ARCH_ENABLED: 1
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: 26

      - name: Build library and prepare iOS codegen
        run: |
          yarn build
          node example/scripts/prepare-ios-codegen.mjs

      - name: Cache Pods
        id: pods-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile', 'DrumPicker.podspec', 'example/Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Pod install
        working-directory: example/ios
        run: |
          bundle install --gemfile=../Gemfile
          bundle exec pod install

      - name: Ensure simulator exists
        run: |
          if ! xcrun simctl list devices available | grep -q "iPhone 16 ("; then
            RUNTIME_ID=$(xcrun simctl list runtimes available -j | \
              python3 -c "import sys,json; r=json.load(sys.stdin)['runtimes']; i=[x for x in r if x.get('isAvailable') and 'iOS' in x.get('name','')]; print(i[-1]['identifier'] if i else '')")
            if [ -z "$RUNTIME_ID" ]; then
              echo "No available iOS runtime found"
              xcrun simctl list runtimes available
              exit 1
            fi
            echo "Creating iPhone 16 simulator with runtime $RUNTIME_ID"
            xcrun simctl create "iPhone 16" \
              com.apple.CoreSimulator.SimDeviceType.iPhone-16 \
              "$RUNTIME_ID"
          fi
          xcrun simctl list devices available | grep "iPhone 16"

      - name: Install applesimutils
        run: |
          brew tap wix/brew
          brew install applesimutils

      - name: Prepare Detox iOS framework
        working-directory: example
        run: npx detox build-framework-cache

      - name: Build iOS app for Detox
        working-directory: example
        run: npx detox build --configuration ios.sim.debug

      - name: Verify iOS JS bundle is embedded
        run: |
          APP=example/ios/build/Build/Products/Release-iphonesimulator/DrumPickerExample.app
          test -f "$APP/main.jsbundle" || {
            echo "main.jsbundle missing in $APP"
            ls -la "$APP" || true
            exit 1
          }
          echo "main.jsbundle OK ($(wc -c < "$APP/main.jsbundle") bytes)"

      - name: Run Detox iOS tests
        working-directory: example
        run: |
          npx detox test --configuration ios.sim.debug \
            --loglevel warn \
            --record-logs failing \
            --take-screenshots failing
        env:
          NSUnbufferedIO: YES

      - name: Upload Detox artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: detox-ios-artifacts
          path: example/artifacts/

  detox-android:
    name: detox-android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn build

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Make Gradle wrapper executable
        run: chmod +x example/android/gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Android app for Detox
        working-directory: example
        run: npx detox build --configuration android.emu.debug

      - name: Install emulator host libraries for Detox CLI
        run: sudo apt-get update && sudo apt-get install -y libpulse0

      # android-emulator-runner creates test_avd_34 on first run.
      # force-avd-creation: false reuses it on cached runners.
      # If the job fails with "No AVD found", set to true temporarily.
      - name: Run Detox Android tests
        uses: reactivecircus/android-emulator-runner@70f4dee990796918b78d040e3278474bdbd348a7 # v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          avd-name: test_avd_34
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash -c "cd example && npx detox test --configuration android.emu.debug --loglevel warn --record-logs failing --take-screenshots failing"

      - name: Upload Detox artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: detox-android-artifacts
          path: example/artifacts/

  all-checks-passed:
    name: all-checks-passed
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - lint-and-typecheck
      - js-tests
      - android-build
      - ios-build
      - android-instrumented
      - ios-unit-tests
      - detox-ios
      - detox-android
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint-and-typecheck.result }}" != "success" || \
                "${{ needs.js-tests.result }}"          != "success" || \
                "${{ needs.android-build.result }}"     != "success" || \
                "${{ needs.ios-build.result }}"         != "success" || \
                "${{ needs.android-instrumented.result }}" != "success" || \
                "${{ needs.ios-unit-tests.result }}"       != "success" || \
                "${{ needs.detox-ios.result }}"            != "success" || \
                "${{ needs.detox-android.result }}"        != "success" ]]; then
            echo "One or more required checks failed."
            exit 1
          fi
          echo "All checks passed."

