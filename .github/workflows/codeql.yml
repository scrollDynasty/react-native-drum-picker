
name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: '19 9 * * 6'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql-default-setup:
    name: Prepare CodeQL (advanced)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Disable CodeQL default setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="repos/${GITHUB_REPOSITORY}/code-scanning/default-setup"
          STATE=$(gh api "$API" --jq .state 2>/dev/null || echo "not-configured")
          echo "CodeQL default setup state: $STATE"
          if [ "$STATE" = "configured" ]; then
            echo "Disabling default setup so the advanced workflow can upload SARIF..."
            if ! gh api "$API" --method PATCH -f state='not-configured'; then
              echo "::error::Could not disable CodeQL default setup via API."
              echo "A repository admin must disable it manually:"
              echo "Settings → Code security → CodeQL analysis → Disable CodeQL"
              echo "See .github/CODEQL.md"
              exit 1
            fi
            echo "Default setup disabled."
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: codeql-default-setup
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install dependencies (TypeScript)
        if: matrix.language == 'javascript-typescript'
        uses: ./.github/actions/setup

      - name: Build TypeScript output
        if: matrix.language == 'javascript-typescript'
        run: yarn build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@dc73d59c2d7bd4f8194098a91219eeee6d8a1719 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Install dependencies (Kotlin)
        if: matrix.build-mode == 'manual'
        uses: ./.github/actions/setup

      - name: Setup Java
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: '17'

      - name: Build Android library for CodeQL
        if: matrix.build-mode == 'manual'
        run: |
          chmod +x example/android/gradlew
          cd example/android
          ./gradlew :react-native-drum-picker:compileDebugKotlin --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@dc73d59c2d7bd4f8194098a91219eeee6d8a1719 # v4
        with:
          category: /language:${{ matrix.language }}
